<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoreDeck · 导播控制栏</title><link rel="stylesheet" href="/assets/director.css"><script defer src="/assets/director.js"></script></head><body class="bar"><header><div class="status-line"><span id="connection">未连接 CS2</span></div><nav><button id="connect">连接 CS2</button><button data-window="dashboard">控制台</button><button data-window="settings">设置</button><button data-window="compact" title="恢复紧凑高度">收紧</button><button data-window="screen">换屏</button><button data-window="close" aria-label="关闭导播控制栏">关闭</button></nav></header><main class="workspace"><section class="game"><div class="game-toggles"><button id="xray" data-toggle="xray">X 光 <b>未知</b></button><button id="ui" data-toggle="ui">游戏 UI <b>未知</b></button></div><div id="control-status" class="control-note"></div></section><section class="replay-panel" aria-label="最新 Replay"><div class="replay-heading"><strong>REPLAY</strong><span id="replay-status">等待 Replay</span></div><button id="replay-play" class="replay-preview" aria-label="播出最新 Replay" disabled><video id="replay-video" muted preload="metadata" playsinline></video><span id="replay-empty">等待最新视频</span><span class="replay-play-icon" aria-hidden="true">▶</span></button><div class="replay-rates" role="group" aria-label="单段 Replay 播放倍率"><button data-replay-rate="0.25" aria-pressed="false">0.25</button><button data-replay-rate="0.5" aria-pressed="false">0.5</button><button data-replay-rate="1" aria-pressed="true" class="active">1</button></div></section><section class="voice"><div class="lane" data-lane="0"><div class="lane-head"><span><strong>队伍 A</strong><small></small></span><button data-latest="0">最新</button></div><div class="clips"><p class="empty">启动 VoiceBridge，等待音频片段</p></div></div><div class="lane" data-lane="1"><div class="lane-head"><span><strong>队伍 B</strong><small></small></span><button data-latest="1">最新</button></div><div class="clips"><p class="empty">两队音频分别排列，可独立预听与推送</p></div></div></section></main><footer><span id="voice-status">正在连接控制台…</span><div><button id="start-voice">启动 VoiceBridge</button><button id="preview-stop">停预听</button><button id="voice-stop">停播</button></div></footer><div role="status" id="notice" hidden></div><audio id="preview"></audio></body></html>
