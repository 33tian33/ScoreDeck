<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精选画面编辑 · ScoreDeck</title><link rel="stylesheet" href="/assets/halftime/editor.css"></head><body><header><div><small>SCOREDECK / BROADCAST STUDIO</small><h1>精选画面编辑</h1></div><nav><a href="/halftime">播出控制</a><button id="copy">复制共用 OBS 地址</button><button id="save" class="primary">保存画面</button></nav></header><main><aside><div class="modes"><button data-mode="half" class="active">半场精选</button><button data-mode="full">全场精选</button></div><p>两个画面独立保存，自动使用同一个输出地址。</p><label class="check"><input id="full-auto" type="checkbox">检测地图胜利后自动播放全场精选</label><label>背景颜色<input id="background" type="color"></label><label class="check"><input id="transparent" type="checkbox">透明背景</label><label>背景图片地址<input id="background-image" placeholder="https://… 或 /media/…"></label><label>导入背景<input id="background-file" type="file" accept="image/png,image/jpeg,image/webp"></label><h2>元素</h2><div class="add"><select id="type"></select><button id="add">＋ 添加</button></div><div id="layers"></div><button id="empty">清空当前画面</button></aside><section class="workspace"><div class="canvas-heading"><strong id="mode-name">半场精选</strong><span>1920 × 1080 · 拖动定位 · 右下角缩放</span></div><div id="canvas"><iframe id="preview" src="/output/halftime?preview=1" title="精选预览" allow="autoplay"></iframe><div id="overlay"></div></div><div class="toolbar"><button id="play">播出当前画面</button><button id="hide">结束播出</button><button id="reload">重新载入</button><span id="notice" role="status"></span></div><p>Replay 自动读取对应精选列表；Radar 可独立选择半场。图名、队名、比分和 BP 跟随当前主赛。</p></section><aside id="properties"><h2>元素属性</h2><p id="empty-selection">选择一个元素开始编辑</p><div id="fields" hidden><strong id="element-name"></strong><div class="coordinates"><label>X<input data-field="x" type="number" min="0" max="1920"></label><label>Y<input data-field="y" type="number" min="0" max="1080"></label><label>宽<input data-field="w" type="number" min="20" max="1920"></label><label>高<input data-field="h" type="number" min="20" max="1080"></label></div><label>字号<input data-field="fontSize" type="number" min="10" max="250"></label><label>颜色<input data-field="color" type="color"></label><label>不透明度<input data-field="opacity" type="range" min="0" max="1" step="0.01"></label><label>文字<input data-field="text" maxlength="200"></label><label>图片 / 视频地址<input data-field="source"></label><label>导入素材<input id="element-file" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm"></label><label>展示页面<select data-field="scene"><option value="schedule">赛程</option><option value="bracket">赛程图</option><option value="standings">积分</option><option value="focus">聚焦</option><option value="prematch">赛前</option><option value="postmatch">赛后 MVP</option><option value="mapStats">当图战绩</option><option value="mapBP">当局 BP</option></select></label><label>Radar 半场<input data-field="half" type="number" min="1" max="100"></label><label>适配<select data-field="fit"><option value="contain">完整显示</option><option value="cover">裁切铺满</option><option value="fill">拉伸</option></select></label><label>播放速度<input data-field="speed" type="number" min="0.25" max="4" step="0.25"></label><label class="check"><input data-field="muted" type="checkbox">静音</label><label class="check"><input data-field="loop" type="checkbox">循环</label><div class="buttons"><button id="up">上一层</button><button id="down">下一层</button><button id="duplicate">复制</button><button id="remove">删除</button></div></div></aside></main><script src="/assets/sync-client.js"></script><script src="/assets/halftime/editor.js?v=obs-copy-2"></script></body></html>
