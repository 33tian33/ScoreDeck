<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中场休息 · ScoreDeck</title><link rel="stylesheet" href="/assets/halftime/control.css"><link rel="stylesheet" href="/assets/minimal-controls.css"></head><body><main><header><div><h1>中场休息</h1><span id="connection">连接中</span></div><div class="actions"><a class="button" href="/highlights">半场 / 全场画面编辑</a><button id="open">打开输出</button><button id="copy">复制固定输出地址</button><button id="copy-auto" class="primary">复制自动中场 OBS 地址</button><button id="save" class="primary">保存设置</button></div></header><div id="notice" role="status"></div><section class="top"><div class="preview"><iframe id="preview" title="中场输出预览（静音）" src="/output/halftime?preview=1" allow="autoplay"></iframe><small>已保存画面 · 预览静音</small></div><div class="transport"><label class="check"><input data-path="autoEnabled" type="checkbox">GSI 检测中场后自动播出</label><label class="check"><input data-path="autoReturn" type="checkbox">第 13 回合 1:50 自动返回</label><label class="check"><input data-path="autoScore" type="checkbox">自动截取 GSI 半场比分</label><div id="auto-status"></div><div class="buttons"><button data-program="show">立即播出中场</button><button data-program="hide">结束中场播出</button></div><strong id="clock">01:00</strong><div class="buttons"><button data-action="start" class="primary">开始 / 继续</button><button data-action="pause">暂停</button><button data-action="reset">重置</button></div><label>中场时长（秒）<input data-path="durationSeconds" type="number" min="1" max="86400"></label><label>结束文字<input data-path="endText" maxlength="30"></label><label class="check"><input data-path="showEndText" type="checkbox">到零显示结束文字</label><div class="buttons"><button data-action="restart-media">重播展示内容</button><button data-action="pause-media">暂停展示</button><button data-action="resume-media">继续展示</button></div><small>倒计时到零保留画面；自动返回在第 13 回合剩余 1:50 时触发。更改时长后点重置生效。</small><div id="module-status"></div></div></section><section class="settings"><article><h2>文字与对阵</h2><div class="grid"><label>中场标题<input data-path="title" maxlength="40"></label><label>轮次名称<input data-path="round" maxlength="70"></label><label class="check"><input data-path="roundAuto" type="checkbox">轮次读取所选比赛</label><label>比赛<select data-path="matchId" id="match"></select></label><label>左队<select data-path="teamAId" class="teams"></select></label><label>右队<select data-path="teamBId" class="teams"></select></label><label>左队名称覆盖<input data-path="nameA" placeholder="读取队伍名称" maxlength="60"></label><label>右队名称覆盖<input data-path="nameB" placeholder="读取队伍名称" maxlength="60"></label><label>左队标覆盖<input data-path="logoA" placeholder="读取队伍图标"><input type="file" data-upload="logoA" accept="image/png,image/jpeg,image/webp"></label><label>右队标覆盖<input data-path="logoB" placeholder="读取队伍图标"><input type="file" data-upload="logoB" accept="image/png,image/jpeg,image/webp"></label><label>比分来源<select data-path="scoreSource"><option value="manual">手动比分</option><option value="match">所选比赛的地图比分</option><option value="gsi">GSI 半场快照</option></select></label><label>第几张地图<select data-path="mapIndex"><option value="0">地图 1</option><option value="1">地图 2</option><option value="2">地图 3</option><option value="3">地图 4</option><option value="4">地图 5</option></select></label><label>左队手动小分<input type="number" data-path="scoreA" min="0" max="999"></label><label>右队手动小分<input type="number" data-path="scoreB" min="0" max="999"></label><label>地图名称覆盖<input data-path="mapName" placeholder="读取来源地图" maxlength="60"></label><label>截取时左队阵营<select data-path="gsiLeft"><option value="CT">CT</option><option value="T">T</option></select></label></div><div class="buttons"><button data-action="capture-score">截取 GSI 比分</button></div><small>GSI 模式在开始时固定比分，换边后不会颠倒；请先选对截取时的左队阵营。</small></article><article><h2>展示位</h2><div class="buttons"><button id="swap">左右交换</button></div><div id="slot-controls"></div></article><article><h2>外观</h2><div class="grid"><label>背景色<input type="color" data-path="background"></label><label>强调色<input type="color" data-path="accent"></label><label>装饰色<input type="color" data-path="blue"></label><label>文字色<input type="color" data-path="foreground"></label><label>动态背景视频<input data-path="backgroundVideo" placeholder="MP4 / WebM 地址"><input type="file" data-upload="backgroundVideo" accept="video/mp4,video/webm"></label><label>背景适配<select data-path="backgroundFit"><option value="cover">裁切铺满</option><option value="contain">完整显示</option><option value="fill">拉伸铺满</option></select></label><label>背景图片<input data-path="backgroundImage" placeholder="留空使用背景色"><input type="file" data-upload="backgroundImage" accept="image/png,image/jpeg,image/webp"></label><label>左展示位占比（%）<input type="number" data-path="leftPercent" min="30" max="75"></label><label>展示位间距（px）<input type="number" data-path="gap" min="0" max="80"></label><label>标题字号倍率<input type="number" data-path="titleScale" min="0.4" max="1.4" step="0.05"></label><label>倒计时字号倍率<input type="number" data-path="timerScale" min="0.4" max="1.4" step="0.05"></label><label>比分字号倍率<input type="number" data-path="scoreScale" min="0.5" max="1.4" step="0.05"></label><label>轮次字号倍率<input type="number" data-path="roundScale" min="0.5" max="1.5" step="0.05"></label></div><div id="visibility" class="checks"></div></article></section><p class="foot">自动中场 OBS 地址：作为 1920 × 1080 浏览器源放在游戏捕获上方；平时透明，中场显示，第 13 回合剩余 1:50 时退场。中场独立播出，不切换主输出 /output/live。自定义网页须允许嵌入。</p></main><script src="/assets/sync-client.js"></script><script src="/assets/halftime/control.js?v=obs-copy-2"></script><script src="/assets/halftime/obs-control.js?v=obs-copy-2"></script></body></html>
