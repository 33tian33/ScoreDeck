name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: modules/replay-source/go.sum
      - name: Build UI
        run: npm run build:ui
      - name: Test Go and build native Replay
        working-directory: modules/replay-source
        run: |
          go test ./internal/replay ./internal/relay
          go build -buildvcs=false -o "$RUNNER_TEMP/ScoreDeck-Replay" ./cmd/replay
      - name: Test ScoreDeck
        run: SCOREDECK_TEST_REPLAY="$RUNNER_TEMP/ScoreDeck-Replay" npm test
